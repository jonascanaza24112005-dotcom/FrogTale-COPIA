name: Build and Zip Unity Game

on:
  push:
    tags:
      - '[0-9]*.[0-9]*.[0-9]*' # Se activa con tags como 0.8.3, 1.0.0, etc.
  workflow_dispatch:

jobs:
  buildAndZip:
    name: Build & Package 📦
    runs-on: windows-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          lfs: true

      - name: Cache Library folder
        uses: actions/cache@v4
        with:
          path: Library
          key: Library-StandaloneWindows64-${{ hashFiles('Assets/**', 'Packages/**', 'ProjectSettings/**') }}

      # 1. Obtener Product Name y Version directamente de ProjectSettings
      - name: Extract Unity Project Name and Version
        id: vars
        shell: pwsh
        run: |
          # Extraer la primera coincidencia del nombre del producto configurado en Unity
          $nameLine = Select-String -Path "ProjectSettings/ProjectSettings.asset" -Pattern "productName:" | Select-Object -First 1
          $projectName = $nameLine.Line -replace '.*productName:\s*', '' -replace '"',''
          
          # Extraer la primera coincidencia de la versión configurada en Unity
          $versionLine = Select-String -Path "ProjectSettings/ProjectSettings.asset" -Pattern "bundleVersion:" | Select-Object -First 1
          $version = $versionLine.Line -replace '.*bundleVersion:\s*', '' -replace '"',''
          
          # Formato exacto del ZIP: FrogTale 0.8.3
          $zipName = "$projectName $version".Trim()
          
          echo "ZIP_NAME=$zipName" >> $env:GITHUB_ENV
          Write-Host "Nombre del ZIP: $zipName.zip"

      # 2. Compilar el Proyecto en Windows
      - name: Build Unity Project
        uses: game-ci/unity-builder@v4
        env:
          UNITY_EMAIL: ${{ secrets.UNITY_EMAIL }}
          UNITY_PASSWORD: ${{ secrets.UNITY_PASSWORD }}
          UNITY_LICENSE: ${{ secrets.UNITY_LICENSE }}
        with:
          targetPlatform: StandaloneWindows64
          allowDirtyBuild: true

      # 3. Crear la carpeta "Builds" y comprimir el contenido de la raíz (sin subcarpetas)
      - name: Zip Build Folder into Builds directory
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path Builds
          Get-ChildItem -Path "build/StandaloneWindows64/*" | Compress-Archive -DestinationPath "Builds/$env:ZIP_NAME.zip"

      # 4. Subir el archivo .zip ubicado en la carpeta Builds como artefacto
      - name: Upload Zip Artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ env.ZIP_NAME }}
          path: Builds/${{ env.ZIP_NAME }}.zip