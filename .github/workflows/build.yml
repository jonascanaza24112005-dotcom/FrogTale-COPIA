name: Build and Zip Unity Game

on:
  push:
    tags:
      - '[0-9]*.[0-9]*.[0-9]*' # Se activa con tags numéricos como 1.0.0, 0.1.2, etc.
  workflow_dispatch: # Permite ejecutarlo manualmente desde GitHub si es necesario

jobs:
  buildAndZip:
    name: Build & Package 📦
    runs-on: windows-latest # Ejecutor nativo de Windows

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          lfs: true

      - name: Cache Library folder
        uses: actions/cache@v4
        with:
          path: Library
          key: Library-StandaloneWindows64-${{ hashFiles('Assets/**', 'Packages/**', 'ProjectSettings/**') }}

      # 1. Obtener Nombre del Repositorio y Versión de Unity
      - name: Extract Unity Project Name and Version
        id: vars
        shell: pwsh
        run: |
          $projectName = "${{ github.event.repository.name }}"
          $version = (Select-String -Path "ProjectSettings/ProjectSettings.asset" -Pattern "bundleVersion:").Line -replace '.*bundleVersion:\s*', ''
          
          # Formato exacto del nombre: NombreDeJuego Version (ej: FrogTale 1.0.0)
          $zipName = "$projectName $version"
          
          echo "ZIP_NAME=$zipName" >> $env:GITHUB_ENV
          Write-Host "Nombre del ZIP: $zipName.zip"

      # 2. Compilar el Proyecto en Windows
      - name: Build Unity Project
        uses: game-ci/unity-builder@v4
        env:
          UNITY_EMAIL: ${{ secrets.UNITY_EMAIL }}
          UNITY_PASSWORD: ${{ secrets.UNITY_PASSWORD }}
          UNITY_LICENSE: ${{ secrets.UNITY_LICENSE }}
        with:
          targetPlatform: StandaloneWindows64
          allowDirtyBuild: true

      # 3. Crear la carpeta "Builds" y comprimir los archivos directamente (sin subcarpetas)
      - name: Zip Build Folder into Builds directory
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path Builds
          Get-ChildItem -Path "build/StandaloneWindows64/*" | Compress-Archive -DestinationPath "Builds/$env:ZIP_NAME.zip"

      # 4. Subir el archivo .zip ubicado en Builds como artefacto
      - name: Upload Zip Artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ env.ZIP_NAME }}
          path: Builds/${{ env.ZIP_NAME }}.zip