name: Build and Zip Unity Game

on:
  push:
    tags:
      - 'v*' # Se activa únicamente al subir tags que comiencen con "v" (ej: v1.0.0)
  workflow_dispatch: # Permite ejecutarlo manualmente desde la pestaña Actions

jobs:
  buildAndZip:
    name: Build & Package 📦
    runs-on: windows-latest # Ejecutor nativo de Windows para compatibilidad con Wwise

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          lfs: true

      - name: Cache Library folder
        uses: actions/cache@v4
        with:
          path: Library
          key: Library-StandaloneWindows64-${{ hashFiles('Assets/**', 'Packages/**', 'ProjectSettings/**') }}

      # 1. Obtener Nombre y Versión desde ProjectSettings.asset
      - name: Extract Unity Project Name and Version
        id: vars
        shell: pwsh
        run: |
          $name = (Select-String -Path "ProjectSettings/ProjectSettings.asset" -Pattern "productName:").Line -replace '.*productName:\s*', ''
          $version = (Select-String -Path "ProjectSettings/ProjectSettings.asset" -Pattern "bundleVersion:").Line -replace '.*bundleVersion:\s*', ''
          $safeName = $name -replace '[^a-zA-Z0-9._-]', '_'
          
          echo "ZIP_NAME=${safeName}_v${version}" >> $env:GITHUB_ENV

      # 2. Compilar el Proyecto en Windows
      - name: Build Unity Project
        uses: game-ci/unity-builder@v4
        env:
          UNITY_EMAIL: ${{ secrets.UNITY_EMAIL }}
          UNITY_PASSWORD: ${{ secrets.UNITY_PASSWORD }}
          UNITY_LICENSE: ${{ secrets.UNITY_LICENSE }}
        with:
          targetPlatform: StandaloneWindows64
          allowDirtyBuild: true

      # 3. Crear la carpeta "Builds" y comprimir el resultado
      - name: Zip Build Folder into Builds directory
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path Builds
          Compress-Archive -Path "build/StandaloneWindows64/*" -DestinationPath "Builds/$env:ZIP_NAME.zip"

      # 4. Subir el archivo .zip ubicado en la carpeta Builds como artefacto
      - name: Upload Zip Artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ env.ZIP_NAME }}
          path: Builds/${{ env.ZIP_NAME }}.zip