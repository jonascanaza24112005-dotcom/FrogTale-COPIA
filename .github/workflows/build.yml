name: Build and Zip Unity Game

on:
  push:
    tags:
      - 'v*' # Se activa únicamente al subir tags que comiencen con "v" (ej: v1.0.0, v0.1)
  workflow_dispatch: # Permite ejecutarlo manualmente desde la pestaña Actions si lo necesitas

jobs:
  buildAndZip:
    name: Build & Package 📦
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          lfs: true

      - name: Cache Library folder
        uses: actions/cache@v4
        with:
          path: Library
          key: Library-StandaloneWindows64-${{ hashFiles('Assets/**', 'Packages/**', 'ProjectSettings/**') }}

      # 1. Obtener Nombre y Versión desde ProjectSettings.asset
      - name: Extract Unity Project Name and Version
        id: vars
        run: |
          GAME_NAME=$(grep 'productName:' ProjectSettings/ProjectSettings.asset | head -n 1 | sed 's/.*productName: //;s/[[:space:]]*$//' | tr -d '\r')
          GAME_VERSION=$(grep 'bundleVersion:' ProjectSettings/ProjectSettings.asset | head -n 1 | sed 's/.*productName: //;s/[[:space:]]*$//' | tr -d '\r')
          
          # Formatear el nombre para reemplazar espacios por guiones
          SAFE_NAME=$(echo "$GAME_NAME" | sed 's/[^a-zA-Z0-9._-]/_/g')
          
          echo "GAME_NAME=$GAME_NAME"
          echo "GAME_VERSION=$GAME_VERSION"
          echo "ZIP_NAME=${SAFE_NAME}_v${GAME_VERSION}" >> $GITHUB_ENV

      # 2. Compilar el Proyecto
      - name: Build Unity Project
        uses: game-ci/unity-builder@v4
        env:
          UNITY_EMAIL: ${{ secrets.UNITY_EMAIL }}
          UNITY_PASSWORD: ${{ secrets.UNITY_PASSWORD }}
          UNITY_LICENSE: ${{ secrets.UNITY_LICENSE }}
        with:
          targetPlatform: StandaloneWindows64
          allowDirtyBuild: true

      # 3. Crear carpeta "Builds" y empaquetar el .zip dentro de ella
      - name: Zip Build Folder into Builds directory
        run: |
          mkdir -p Builds
          cd build/StandaloneWindows64
          zip -r "../../Builds/${{ env.ZIP_NAME }}.zip" .

      # 4. Subir el archivo .zip ubicado en la carpeta Builds como artefacto
      - name: Upload Zip Artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ env.ZIP_NAME }}
          path: Builds/${{ env.ZIP_NAME }}.zip